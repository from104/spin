# SPIN 공유 링크 백엔드 — Apache 프록시 조각
#
# 정본: docs/PLAN-SHARE-LINK.md 결정 3·12.
#
# ── 어디에 넣나 ─────────────────────────────────────────────────────────────────────
# 이 파일은 **vhost 안에** Include 되는 조각이다. 운영(Lightsail Bitnami)의
#   /opt/bitnami/apache2/conf/vhosts/spin-vhost.conf
# 의 `<VirtualHost *:443>` 블록 안에 다음 한 줄을 넣는다:
#
#     Include "/opt/bitnami/apache2/conf/vhosts/spin-share.conf"
#
# ⚠️ scripts/deploy-share.sh 는 이 줄이 없으면 **안내만 하고 vhost 를 고치지 않는다.**
#    vhost 는 같은 인스턴스의 다른 사이트와 한 Apache 를 나눠 쓰는 파일이라, 스크립트가 자동으로 손대면 그 실수의
#    범위가 이 기능 밖까지 간다(2026-09-07 결정 12). 사람이 한 줄 넣고 `apachectl -t` 로 본다.
#
# ── 왜 앱과 같은 출처인가 ───────────────────────────────────────────────────────────
# 앱은 API 주소를 «상대 경로 /api/share» 하나로만 안다(도메인 독립 — 결정 3). 그래야 개발
# 서버·spin.atit.app·앞으로 생길 어느 주소에서도 자기 출처를 불러 링크를 만든다. 그 규약을
# 서버 쪽에서 지키는 것이 이 프록시다.

<IfModule proxy_module>
  # 백엔드가 Host 헤더로 자기 주소를 판단하지는 않지만, 로그·디버깅에서 원래 호스트가
  # 보이는 편이 낫다.
  ProxyPreserveHost On

  # ⚠️ /api/share 만 넘긴다. /api 통째로 넘기면 앞으로 다른 /api/* 를 붙일 때 이 백엔드가
  #    말없이 그것까지 먹는다.
  # retry=0 — 백엔드가 잠깐 죽었을 때 Apache 가 60초 동안 그 워커를 «죽은 것»으로 기억하고
  #    503 을 즉시 뱉는 기본 동작을 끈다. systemd 가 2초 만에 되살리는데 프록시가 1분을
  #    기다리면 재시작이 1분짜리 장애가 된다.
  ProxyPass        "/api/share" "http://127.0.0.1:8787/api/share" retry=0 connectiontimeout=5 timeout=30
  ProxyPassReverse "/api/share" "http://127.0.0.1:8787/api/share"
</IfModule>

# 본문 상한. 서버도 256 KiB(262144)에서 413 을 내지만, 여기서 먼저 끊으면 그 바이트가 아예
# 프로세스에 안 닿는다. 266240 = 262144 + 4096(헤더·경계 여유).
# ⚠️ 서버의 SHARE_MAX_BYTES 를 올리면 이 값도 같이 올려야 한다 — 안 그러면 Apache 가 먼저
#    413 을 내고 서버 쪽 상한은 영영 안 쓰인다.
# ── ⚠️ 2026-09-08: 70000(64 KiB 시절) → 266240. 세션 공유가 들어오며 본문 상한이 256 KiB 로
#    올랐다(PLAN-SHARE-LINK 결정 S3). 이 줄을 안 올리면 세션 링크는 앱·서버가 다 허용해도
#    Apache 에서만 413 이 나고, 그 413 은 개발 서버(프록시 없음)에서 재현되지 않는다.
<Location "/api/share">
  LimitRequestBody 266240
</Location>
