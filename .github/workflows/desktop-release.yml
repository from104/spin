# 데스크톱(Tauri) 3-OS 빌드 — 리눅스·윈도우·맥. **그리고 안드로이드(Capacitor).**
#
# 왜 CI 인가: 각 OS 의 설치 패키지는 그 OS 에서만 나온다(맥 .dmg 는 macOS,
# 윈도우 .msi/.exe 는 Windows). gofu 는 리눅스뿐이라 나머지 둘은 여기서 만든다.
#
# ⚠️ **이름은 desktop-release 지만 안드로이드도 여기서 나간다.** 파일을 따로 두는 쪽이
# 이름으로는 깔끔하지만, 그러면 태그 하나에 릴리스 초안이 둘 생기거나(각자 만든다) 한쪽이
# 아직 없는 초안에 올리려다 «release not found» 로 죽는다. **릴리스 초안 하나에 전부 붙이려면
# 한 워크플로여야 한다** — 초안을 만드는 것은 build 잡의 tauri-action 이고, android 잡은
# `needs: build` 로 그 뒤에 선다. 안드로이드 쪽 정본은 docs/PLAN-ANDROID.md §1 결정 17·18.
#
# 언제 도는가
#   · 태그 `v*` 를 밀면        → 산출물을 GitHub Release(초안) 에 올린다
#   · Actions 에서 수동 실행    → 릴리스는 만들지 않고 아티팩트로만 받는다(빌드가 깨졌는지 보는 용도)
#
# 서명은 아직 없다. 맥은 Gatekeeper, 윈도우는 SmartScreen 경고가 뜬다 —
# 서명·공증은 스토어 계정과 함께 0.7 에서 다룬다.
#
# 구글 로그인용 저장소 secret 2종을 GitHub 저장소 설정(Settings → Secrets and
# variables → Actions)에 등록해야 한다 — SPIN_DESKTOP_GOOGLE_CLIENT_ID,
# SPIN_DESKTOP_GOOGLE_CLIENT_SECRET (값은 .env.local 참고, 여기 적지 않는다).
# 안드로이드 서명용으로 4종이 더 필요하다 — SPIN_ANDROID_KEYSTORE_BASE64,
# SPIN_ANDROID_KEYSTORE_PASSWORD, SPIN_ANDROID_KEY_ALIAS, SPIN_ANDROID_KEY_PASSWORD
# (만드는 법은 docs/PLAN-ANDROID.md §5 1·2번). 안드로이드 클라이언트 ID·웹 출처는 **공개값이라
# 시크릿이 아니다** — android 잡의 `env:` 에 리터럴로 적혀 있다.
name: desktop-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '릴리스를 만들지 않고 아티팩트만 남긴다'
        type: boolean
        default: true

jobs:
  gate:
    # 3 OS 빌드는 비싸다. 타입·테스트가 깨진 코드로 30분을 태우지 않도록 먼저 막는다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: 리눅스 시스템 의존성 (cargo check 용)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: cargo check --manifest-path src-tauri/Cargo.toml

  build:
    needs: gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 맥은 인텔·애플실리콘을 한 번들에 담는다(universal) — 사용자가 고르지 않아도 된다.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # ubuntu-22.04 를 고정한다. 최신 러너에서 빌드하면 그 glibc 이상에서만 돌아
          # 조금 낡은 배포판에서 실행이 안 된다 — 낮은 쪽에서 빌드해야 위로 호환된다.
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 리눅스 시스템 의존성
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ⚠️ **빈 시크릿은 조용히 통과한다.** 없는 시크릿을 GitHub 은 빈 문자열로 넘기고, Vite 는
      # 빈 값을 그대로 인라인하고, 앱은 [Google 계정 연결] 을 비활성으로 그릴 뿐 오류를 내지
      # 않는다 — 어디에도 표시가 안 나서 **설치본을 켜 보기 전에는 아무도 모른다.**
      # 실제로 0.6.9·0.6.10 의 설치본 전부가 구글 동기화 없이 나갔다: 저장소에
      # `SPIN_DESKTOP_GOOGLE_CLIENT_ID` 가 **등록조차 안 돼 있었다**(2026-09-16 기현님 MSI 실기
      # 제보로 발각, 같은 날 등록). 그래서 굽기 전에 여기서 끊는다. 값은 찍지 않고 **있는지만** 본다.
      - name: 주입할 환경변수 확인 (값은 찍지 않는다)
        shell: bash
        env:
          SPIN_DESKTOP_GOOGLE_CLIENT_ID: ${{ secrets.SPIN_DESKTOP_GOOGLE_CLIENT_ID }}
          SPIN_DESKTOP_GOOGLE_CLIENT_SECRET: ${{ secrets.SPIN_DESKTOP_GOOGLE_CLIENT_SECRET }}
        run: |
          fail=0
          for k in SPIN_DESKTOP_GOOGLE_CLIENT_ID SPIN_DESKTOP_GOOGLE_CLIENT_SECRET; do
            if [ -z "${!k}" ]; then
              echo "::error::$k 가 비어 있습니다 — Settings → Secrets and variables → Actions 에 등록하세요"
              fail=1
            else
              echo "$k: 있음"
            fi
          done
          exit $fail

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPIN_DESKTOP_GOOGLE_CLIENT_ID: ${{ secrets.SPIN_DESKTOP_GOOGLE_CLIENT_ID }}
          SPIN_DESKTOP_GOOGLE_CLIENT_SECRET: ${{ secrets.SPIN_DESKTOP_GOOGLE_CLIENT_SECRET }}
          # 공유 링크가 가리킬 **웹앱의 공개 출처**. 비밀이 아니라 공개 도메인이므로 시크릿이
          # 아니라 여기 그대로 적는다(시크릿으로 두면 이번처럼 빠졌을 때 알아채기만 더 어렵다).
          # 없으면 데스크톱 앱이 `tauri://localhost/api/share` 를 부른다 — 2026-09-13 기현님
          # 실기의 "서버에 닿지 못했습니다" 가 바로 그것이다(src/share/api.ts 머리말).
          SPIN_DESKTOP_WEB_ORIGIN: https://spin.atit.app
          # 업데이트 서명(2026-09-16). ⚠️ 이 둘이 없으면 `createUpdaterArtifacts: true` 라도
          # `.sig` 가 안 나오고, 서명 없는 업데이트는 플러그인이 **거부한다**(끌 수 없다).
          # 값은 `~/.tauri/spin.key`(개인키, 이 기계의 600) 에서 왔고 저장소 시크릿에만 있다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 태그 푸시이고 dry_run 이 아닐 때만 릴리스를 만든다(수동 실행을 태그
          # ref 에 대고 돌려도 dry_run=true 기본값이면 릴리스를 만들지 않는다).
          # push 이벤트에는 inputs 컨텍스트가 없다 — `!inputs.dry_run` 이 참이 되리라는 전제에
          # 기대지 않고 event_name 으로 가른다(이 워크플로는 아직 한 번도 돈 적이 없다).
          tagName: ${{ (startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)) && github.ref_name || '' }}
          releaseName: 'SPIN __VERSION__'
          releaseBody: '설치 패키지는 아래 자산에 있습니다. 서명이 없어 맥·윈도우는 첫 실행 시 경고가 뜹니다.'
          releaseDraft: true
          # `latest.json` 을 릴리스에 함께 올린다 — 앱이 `releases/latest/download/latest.json`
          # 을 보고 새 판을 찾는다(tauri.conf.json 의 endpoints).
          includeUpdaterJson: true
          prerelease: false
          args: ${{ matrix.args }}

      # AppImageHub 가 읽는 파일명 규약으로 고친다 (2026-09-16).
      #
      # 카탈로그(appimage.github.io)는 저장소 링크 하나만 받고 **파일명으로** 버전을 잡는다.
      # 규약은 `앱-버전-아키.AppImage` 인데(하이픈·`x86_64`) Tauri 는 `SPIN_0.6.9_amd64.AppImage`
      # 로 굽는다. 안 고치면 첫 등록은 되어도 **다음 릴리스부터 카탈로그가 옛 버전에 멈춘다.**
      # 0.6.9 는 손으로 고쳤고, 이 단계가 그 손질을 없앤다.
      #
      # ⚠️ 릴리스를 **태그로 못 찾는다.** `releaseDraft: true` 라 갓 만들어진 릴리스는 초안이고,
      #    `GET /releases/tags/{tag}` 는 초안에 404 를 준다(실측). 목록을 받아 tag_name 으로 고른다.
      # ⚠️ 리눅스 레그에서만 돈다 — AppImage 가 거기서만 나온다.
      # ⚠️ AppImage 가 **한 개**라는 전제다(지금 리눅스 매트릭스는 x86_64 하나뿐). ARM 을
      #    더하는 날 자산이 둘이 되므로 `head -1` 이 아무거나 집는다 — 그때 아키별로 돌려야 한다.
      #    변환식이 `_amd64` 만 보므로 다른 아키 이름은 조용히 그대로 지나간다(로그에 남는다).
      - name: AppImage 이름을 카탈로그 규약으로
        if: ${{ matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # ⚠️ `| head -1` 이 아니라 `sed -n 1p` — head 는 첫 줄에서 파이프를 닫아 gh 가 SIGPIPE(141)
          # 로 죽고 pipefail 이 그것을 실패로 센다(2026-09-17 android 잡에서 실측한 함정과 같은 모양).
          rid=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id" | sed -n '1p')
          if [ -z "$rid" ]; then echo "릴리스를 못 찾았다: $TAG"; exit 1; fi
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$rid" \
            --jq '.assets[] | select(.name|endswith(".AppImage")) | .name' | sed -n '1p')
          if [ -z "$old" ]; then echo "AppImage 자산이 없다"; exit 1; fi
          # SPIN_0.6.9_amd64.AppImage → SPIN-0.6.9-x86_64.AppImage
          new=$(printf '%s' "$old" | sed -E 's/_([0-9][^_]*)_amd64\.AppImage$/-\1-x86_64.AppImage/')
          if [ "$new" = "$old" ]; then
            echo "이미 규약에 맞거나 이름 꼴이 바뀌었다 — 그대로 둔다: $old"
            exit 0
          fi
          aid=$(gh api "repos/$GITHUB_REPOSITORY/releases/$rid" \
            --jq ".assets[] | select(.name==\"$old\") | .id")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$aid" -f name="$new" --jq .name
          echo "$old → $new"

          # ⚠️ **`latest.json` 도 같이 고쳐야 한다.** 그 파일은 tauri-action 이 **이름을 고치기
          # 전에** 썼으므로 리눅스 항목이 옛 이름(`SPIN_x.y.z_amd64.AppImage`)을 가리킨 채로
          # 남는다 — 방금 그 이름의 자산은 사라졌다. 그대로 두면 **리눅스 자동 업데이트가 404**
          # 로 죽는데, 릴리스 화면에는 파일이 멀쩡히 다 있어서 아무 표시도 안 난다
          # (2026-09-16 v0.6.11 에서 실제로 그 상태로 나갈 뻔했다 — 손으로 고쳐 올렸다).
          jid=$(gh api "repos/$GITHUB_REPOSITORY/releases/$rid" \
            --jq '.assets[] | select(.name=="latest.json") | .id')
          if [ -z "$jid" ]; then echo "latest.json 이 없다 — 업데이터 자산을 안 만든 회차인가"; exit 1; fi
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$jid" > latest.json
          # 파이썬 대신 jq 를 쓴다 — `run: |` 블록 안에서는 모든 줄이 들여쓰여 있어야 하는데,
          # 파이썬 소스는 들여쓰기가 곧 문법이라 둘이 싸운다(heredoc 으로 피하려 해도 종료자를
          # 들여쓰면 heredoc 이 안 끝난다). jq 는 여러 줄이어도 들여쓰기가 자유롭다.
          jq --arg old "$old" --arg new "$new" \
            '.platforms |= with_entries(.value.url |= (if endswith($old) then .[:-($old|length)] + $new else . end))' \
            latest.json > latest.json.new
          mv latest.json.new latest.json
          grep -q "$new" latest.json || { echo "latest.json 을 못 고쳤다 — 이름 규칙이 바뀌었나"; exit 1; }
          echo "latest.json 의 리눅스 주소를 $new 로 고쳤다"
          gh release upload "$TAG" latest.json --clobber

      - name: 아티팩트 업로드
        if: ${{ !startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/upload-artifact@v4
        with:
          name: spin-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn

  android:
    # 왜 `needs: build` 인가: 릴리스 초안을 만드는 것은 build 잡의 tauri-action 하나뿐이다.
    # 그래서 여기서 `gh release upload` 로 APK 를 붙이려면 그 잡이 끝난 뒤여야 한다.
    # 병렬로 돌리면 가벼운 안드로이드 쪽이 먼저 도착해 «release not found» 로 죽는다 —
    # qcalc 0.13.1 에서 실제로 그랬고, 거기서는 30분짜리 대기 루프로 때웠다. `needs` 한 줄이면
    # 그 루프가 통째로 필요 없다. 대가는 APK 가 데스크톱 3종을 기다리는 것뿐이다(PLAN-ANDROID 결정 18).
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    # 공개값 둘은 시크릿이 아니라 여기 리터럴로 둔다 — AGENTS.md §7: "비밀이 아닌 값은
    # 워크플로에. 시크릿으로 두면 이번처럼 빠졌을 때 알아채기만 더 어렵다."
    env:
      # 공유 링크가 가리킬 웹앱의 공개 출처. 없으면 앱이 `https://localhost/api/share` 를
      # 불러 아무 데도 닿지 않는다 — 데스크톱의 SPIN_DESKTOP_WEB_ORIGIN 과 같은 문제다.
      SPIN_ANDROID_WEB_ORIGIN: https://spin.atit.app
      # ⚠️ **아직 발급 전이다.** 구글 클라우드 콘솔에 Android 유형 클라이언트를 만들고 업로드
      # 키·디버그 키의 SHA-1 둘을 등록해야 값이 나온다(PLAN-ANDROID §5 3번). 여기를 빈
      # 문자열로 두면 «없다» 가 «있다» 처럼 조용히 통과하므로 자리표시자를 박아 둔다 —
      # 아래 확인 단계가 이 값을 보면 멈춘다. 발급되면 이 줄만 실제 ID 로 바꾼다.
      SPIN_ANDROID_GOOGLE_CLIENT_ID: TODO-구글-클라우드-콘솔-Android-클라이언트-미발급

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `src-android/app/capacitor.build.gradle` 이 sourceCompatibility 21 을 요구한다.
      # 러너 기본 JDK 를 그대로 쓰면 AGP 8.13 이 터진다(PLAN-ANDROID 결정 15).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 패키지 목록은 `src-android/variables.gradle` 의 compileSdk/targetSdk **36** 에 맞춘다.
      # 여기가 낮으면 Gradle 이 빌드 도중에 플랫폼을 스스로 받으려 들고, 라이선스를 수락하지
      # 않은 러너에서는 거기서 죽는다(gofu 에서는 이미 수락돼 있어 조용히 넘어갔다 — 러너는 아니다).
      # build-tools 는 아래 검산 단계의 aapt2·apksigner 가 쓴다.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # 데스크톱 쪽 「주입할 환경변수 확인」과 같은 이유다(위 build 잡의 긴 주석 참고) —
      # 빈 값은 그대로 구워지고 앱은 그 기능을 조용히 비활성으로 그린다.
      # 안드로이드에는 함정이 하나 더 있다: 공개값 둘은 시크릿이 아니라 위 `env:` 의 리터럴이라
      # **«등록을 깜빡한다» 가 아니라 «자리표시자인 채로 지나간다» 로 실패한다.** 그래서 비었는지
      # 뿐 아니라 아직 TODO- 로 시작하는지도 같이 본다. 값은 찍지 않고 있는지만 본다.
      - name: 주입할 환경변수 확인 (값은 찍지 않는다)
        shell: bash
        env:
          SPIN_ANDROID_KEYSTORE_BASE64: ${{ secrets.SPIN_ANDROID_KEYSTORE_BASE64 }}
          SPIN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SPIN_ANDROID_KEYSTORE_PASSWORD }}
          SPIN_ANDROID_KEY_ALIAS: ${{ secrets.SPIN_ANDROID_KEY_ALIAS }}
          SPIN_ANDROID_KEY_PASSWORD: ${{ secrets.SPIN_ANDROID_KEY_PASSWORD }}
        run: |
          fail=0
          for k in SPIN_ANDROID_GOOGLE_CLIENT_ID SPIN_ANDROID_WEB_ORIGIN \
                   SPIN_ANDROID_KEYSTORE_BASE64 SPIN_ANDROID_KEYSTORE_PASSWORD \
                   SPIN_ANDROID_KEY_ALIAS SPIN_ANDROID_KEY_PASSWORD; do
            if [ -z "${!k}" ]; then
              echo "::error::$k 가 비어 있습니다 — 시크릿 넷은 Settings → Secrets and variables → Actions 에, 공개값 둘은 이 워크플로 android 잡의 env 에 적습니다"
              fail=1
            else
              echo "$k: 있음"
            fi
          done
          case "$SPIN_ANDROID_GOOGLE_CLIENT_ID" in
            TODO-*)
              echo "::error::SPIN_ANDROID_GOOGLE_CLIENT_ID 가 아직 자리표시자입니다 — docs/PLAN-ANDROID.md §5 3번대로 발급한 뒤 이 워크플로의 android 잡 env 를 실제 ID 로 바꾸세요"
              fail=1
              ;;
          esac
          exit $fail

      # 워크스페이스 **밖**($RUNNER_TEMP)에 푼다 — 워크스페이스에 두면 아티팩트·산출물에
      # 딸려 들어갈 여지가 생긴다. 어떤 경로로 끝나든 마지막 단계에서 지운다.
      - name: 서명 키스토어 풀기
        shell: bash
        env:
          SPIN_ANDROID_KEYSTORE_BASE64: ${{ secrets.SPIN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$SPIN_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/spin-upload.jks"
          # base64 가 깨져도 `base64 -d` 는 빈 파일을 남기고 0 으로 끝나는 경우가 있다.
          # 빈 키스토어로 Gradle 에 들어가면 에러가 «비밀번호가 틀렸다» 로 나와 원인을 가린다.
          test -s "$RUNNER_TEMP/spin-upload.jks"

      - run: npm ci

      # `./gradlew` 를 여기서 직접 부르지 않는 이유(AGENTS §3 두 벌 두지 않는다): JDK 고르기와
      # 「서명 env 넷이 다 있으면 릴리스, 아니면 디버그」 갈림이 `scripts/android-build.sh` 한
      # 곳에 있다. CI 가 gradlew 를 따로 부르면 그 갈림이 두 벌이 되고, 둘이 어긋나는 날
      # **CI 에서만** 다른 물건이 나온다. 기현님이 gofu 에서 치는 것과 같은 명령을 여기서도 친다.
      #
      # `npm run android:build` = `SPIN_ANDROID_BUILD=1 npm run build` → `npx cap sync android`
      # → `scripts/android-build.sh`(= `./gradlew assembleRelease bundleRelease`).
      # ⚠️ 순수 `vite build` 가 아니다 — `npm run build` 끝에 SEO 프리렌더가 붙어 있고,
      #    `SPIN_ANDROID_BUILD=1` 이 vite 의 envPrefix 에 `SPIN_ANDROID_` 를 켠다. 이 신호가
      #    없으면 위 두 값이 번들에 **안 들어간 채로** 초록이 난다(결정 18·19).
      - name: 안드로이드 릴리스 빌드 (APK + AAB)
        env:
          SPIN_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/spin-upload.jks
          SPIN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SPIN_ANDROID_KEYSTORE_PASSWORD }}
          SPIN_ANDROID_KEY_ALIAS: ${{ secrets.SPIN_ANDROID_KEY_ALIAS }}
          SPIN_ANDROID_KEY_PASSWORD: ${{ secrets.SPIN_ANDROID_KEY_PASSWORD }}
        run: npm run android:build

      - name: 산출물 이름 짓고 검산
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          APK_SRC=src-android/app/build/outputs/apk/release/app-release.apk
          AAB_SRC=src-android/app/build/outputs/bundle/release/app-release.aab

          # ⚠️ **「릴리스인데 디버그가 나왔다」 가드.** `scripts/android-build.sh` 는 서명 env 가
          # 하나라도 비면 `assembleDebug` 로 조용히 떨어진다 — 손으로 돌릴 때는 그게 맞지만
          # 여기서는 디버그 APK 가 릴리스 자산으로 올라가는 길이 된다(AGENTS §7 의 0.6.9 사고와
          # 같은 모양: 빌드는 초록인데 나간 물건이 다르다). 위 확인 단계를 통과했는데도 릴리스
          # 산출물이 없으면 그 갈림이 어긋난 것이므로 여기서 끊는다.
          for f in "$APK_SRC" "$AAB_SRC"; do
            test -f "$f" || { echo "::error::$f 가 없습니다 — 서명 env 가 비어 디버그로 떨어진 회차입니다"; exit 1; }
          done

          APK="SPIN_${VER}_android.apk"
          AAB="SPIN_${VER}_android.aab"
          cp "$APK_SRC" "$APK"
          cp "$AAB_SRC" "$AAB"

          # versionName·versionCode 는 `app/build.gradle` 이 package.json 에서 끌어온다.
          # 그 배선이 끊기면 낡은 버전이 박힌 APK 가 조용히 나가므로(qcalc 전례) 구워진
          # 물건에서 되읽어 대조한다. versionCode 는 결정 14 의 식으로 따로 계산해 맞춘다 —
          # 둘 중 하나만 틀리는 경우가 있다(같은 곳에서 나오지만 식이 다르다).
          BT="$ANDROID_HOME/build-tools/36.0.0"
          # ⚠️ `| head -1` 을 쓰지 않는다. head 가 첫 줄에서 파이프를 닫으면 aapt2 가 SIGPIPE 로
          # 죽고, `set -o pipefail` 이 그 141 을 살려 **이 단계 전체가 실패한다**(gofu 실측:
          # 출력이 4KB 뿐인데도 재현된다). sed 는 스트림을 끝까지 읽으므로 그 일이 없다.
          BADGING=$("$BT/aapt2" dump badging "$APK" | sed -n '1p')
          echo "$BADGING"
          case "$BADGING" in
            *"versionName='${VER}'"*) ;;
            *) echo "::error::APK 버전이 package.json(${VER})과 다릅니다: $BADGING"; exit 1 ;;
          esac
          WANT_CODE=$(node -p "const[a,b,c]=require('./package.json').version.split('.').map(Number);a*1000000+b*1000+c")
          case "$BADGING" in
            *"versionCode='${WANT_CODE}'"*) ;;
            *) echo "::error::versionCode 가 결정 14 의 식(${WANT_CODE})과 다릅니다: $BADGING"; exit 1 ;;
          esac

          # 서명이 실제로 붙었는지 본다 — 서명 없는 APK 는 설치도 안 되고 Play 도 안 받는데
          # 파일 자체는 멀쩡히 나온다.
          "$BT/apksigner" verify "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

      # AAB 도 릴리스에 올린다. Play 업로드는 사람이 콘솔에서 하므로(PLAN-ANDROID §5 5번)
      # 받을 자리가 있어야 하는데, 아티팩트는 90일 뒤 사라지고 릴리스 자산은 남는다.
      # `gh release upload` 는 **초안 릴리스에도 붙는다**. 404 나는 것은 위 AppImage 단계
      # 주석대로 `GET /releases/tags/{tag}` 를 **직접** 칠 때이고, gh 는 그 404 를 받으면
      # 릴리스 목록을 훑어 초안을 찾는 우회를 자기 안에 갖고 있다. 이 워크플로의 latest.json
      # 업로드가 이미 같은 길이다 — 거기가 깨지면 여기도 같이 깨지므로 둘이 갈라지지 않는다.
      - name: 릴리스에 올리기 (APK · AAB)
        if: ${{ startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.pack.outputs.apk }}" "${{ steps.pack.outputs.aab }}" --clobber

      - name: 아티팩트 업로드
        if: ${{ !startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/upload-artifact@v4
        with:
          name: spin-android
          path: |
            ${{ steps.pack.outputs.apk }}
            ${{ steps.pack.outputs.aab }}
          if-no-files-found: warn

      # 어떤 경로로 끝나든 지운다. 러너는 회차마다 새로 뜨므로 지금은 의례에 가깝지만,
      # self-hosted 러너로 옮기는 날 이 한 줄이 없으면 업로드 키가 디스크에 남는다.
      - name: 키스토어 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/spin-upload.jks"
