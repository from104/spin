# 데스크톱(Tauri) 3-OS 빌드 — 리눅스·윈도우·맥.
#
# 왜 CI 인가: 각 OS 의 설치 패키지는 그 OS 에서만 나온다(맥 .dmg 는 macOS,
# 윈도우 .msi/.exe 는 Windows). gofu 는 리눅스뿐이라 나머지 둘은 여기서 만든다.
#
# 언제 도는가
#   · 태그 `v*` 를 밀면        → 산출물을 GitHub Release(초안) 에 올린다
#   · Actions 에서 수동 실행    → 릴리스는 만들지 않고 아티팩트로만 받는다(빌드가 깨졌는지 보는 용도)
#
# 서명은 아직 없다. 맥은 Gatekeeper, 윈도우는 SmartScreen 경고가 뜬다 —
# 서명·공증은 스토어 계정과 함께 0.7 에서 다룬다.
#
# 구글 로그인용 저장소 secret 2종을 GitHub 저장소 설정(Settings → Secrets and
# variables → Actions)에 등록해야 한다 — SPIN_DESKTOP_GOOGLE_CLIENT_ID,
# SPIN_DESKTOP_GOOGLE_CLIENT_SECRET (값은 .env.local 참고, 여기 적지 않는다).
name: desktop-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '릴리스를 만들지 않고 아티팩트만 남긴다'
        type: boolean
        default: true

jobs:
  gate:
    # 3 OS 빌드는 비싸다. 타입·테스트가 깨진 코드로 30분을 태우지 않도록 먼저 막는다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: 리눅스 시스템 의존성 (cargo check 용)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: cargo check --manifest-path src-tauri/Cargo.toml

  build:
    needs: gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 맥은 인텔·애플실리콘을 한 번들에 담는다(universal) — 사용자가 고르지 않아도 된다.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # ubuntu-22.04 를 고정한다. 최신 러너에서 빌드하면 그 glibc 이상에서만 돌아
          # 조금 낡은 배포판에서 실행이 안 된다 — 낮은 쪽에서 빌드해야 위로 호환된다.
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 리눅스 시스템 의존성
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPIN_DESKTOP_GOOGLE_CLIENT_ID: ${{ secrets.SPIN_DESKTOP_GOOGLE_CLIENT_ID }}
          SPIN_DESKTOP_GOOGLE_CLIENT_SECRET: ${{ secrets.SPIN_DESKTOP_GOOGLE_CLIENT_SECRET }}
        with:
          # 태그 푸시이고 dry_run 이 아닐 때만 릴리스를 만든다(수동 실행을 태그
          # ref 에 대고 돌려도 dry_run=true 기본값이면 릴리스를 만들지 않는다).
          # push 이벤트에는 inputs 컨텍스트가 없다 — `!inputs.dry_run` 이 참이 되리라는 전제에
          # 기대지 않고 event_name 으로 가른다(이 워크플로는 아직 한 번도 돈 적이 없다).
          tagName: ${{ (startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)) && github.ref_name || '' }}
          releaseName: 'SPIN __VERSION__'
          releaseBody: '설치 패키지는 아래 자산에 있습니다. 서명이 없어 맥·윈도우는 첫 실행 시 경고가 뜹니다.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # AppImageHub 가 읽는 파일명 규약으로 고친다 (2026-09-16).
      #
      # 카탈로그(appimage.github.io)는 저장소 링크 하나만 받고 **파일명으로** 버전을 잡는다.
      # 규약은 `앱-버전-아키.AppImage` 인데(하이픈·`x86_64`) Tauri 는 `SPIN_0.6.9_amd64.AppImage`
      # 로 굽는다. 안 고치면 첫 등록은 되어도 **다음 릴리스부터 카탈로그가 옛 버전에 멈춘다.**
      # 0.6.9 는 손으로 고쳤고, 이 단계가 그 손질을 없앤다.
      #
      # ⚠️ 릴리스를 **태그로 못 찾는다.** `releaseDraft: true` 라 갓 만들어진 릴리스는 초안이고,
      #    `GET /releases/tags/{tag}` 는 초안에 404 를 준다(실측). 목록을 받아 tag_name 으로 고른다.
      # ⚠️ 리눅스 레그에서만 돈다 — AppImage 가 거기서만 나온다.
      # ⚠️ AppImage 가 **한 개**라는 전제다(지금 리눅스 매트릭스는 x86_64 하나뿐). ARM 을
      #    더하는 날 자산이 둘이 되므로 `head -1` 이 아무거나 집는다 — 그때 아키별로 돌려야 한다.
      #    변환식이 `_amd64` 만 보므로 다른 아키 이름은 조용히 그대로 지나간다(로그에 남는다).
      - name: AppImage 이름을 카탈로그 규약으로
        if: ${{ matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rid=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          if [ -z "$rid" ]; then echo "릴리스를 못 찾았다: $TAG"; exit 1; fi
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$rid" \
            --jq '.assets[] | select(.name|endswith(".AppImage")) | .name' | head -1)
          if [ -z "$old" ]; then echo "AppImage 자산이 없다"; exit 1; fi
          # SPIN_0.6.9_amd64.AppImage → SPIN-0.6.9-x86_64.AppImage
          new=$(printf '%s' "$old" | sed -E 's/_([0-9][^_]*)_amd64\.AppImage$/-\1-x86_64.AppImage/')
          if [ "$new" = "$old" ]; then
            echo "이미 규약에 맞거나 이름 꼴이 바뀌었다 — 그대로 둔다: $old"
            exit 0
          fi
          aid=$(gh api "repos/$GITHUB_REPOSITORY/releases/$rid" \
            --jq ".assets[] | select(.name==\"$old\") | .id")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$aid" -f name="$new" --jq .name
          echo "$old → $new"

      - name: 아티팩트 업로드
        if: ${{ !startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/upload-artifact@v4
        with:
          name: spin-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn
