<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <!-- 파비콘. 마스터는 `public/logo.svg` 하나이고 아래 PNG 는 거기서 구운 것이다(art/README.md).
         SVG 를 먼저 두는 이유: 확대·고배율 화면에서 안 뭉개지고 1.6 KB 로 가장 작다.
         PNG 두 벌을 함께 두는 이유: **16px 로 줄면 차체 뒤끝의 흰 파선이 뭉개진다** — 그 크기에서는
         브라우저가 골라 쓰도록 32/48 을 미리 구워 준다(SVG 를 못 읽는 브라우저의 대비이기도 하다). -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- §6.4 태블릿 앱 경험 — "홈 화면에 추가" 하면 브라우저 크롬 없이 전체화면으로 뜬다.
         나중에 네이티브 태블릿 앱으로 포팅하기 전까지 그 자리를 대신하고, 포팅 후에도
         start_url·아이콘·테마색은 그대로 재사용된다.
         iOS 는 아직 manifest 의 display 를 보지 않으므로 apple- 메타가 별도로 필요하다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SPIN" />
    <!-- black-translucent: 상태바 뒤까지 앱이 그린다. 그 겹침은 appShell.css 의
         env(safe-area-inset-*) 여백이 받아낸다(둘은 한 쌍이라 하나만 두면 UI 가 먹힌다). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 검색엔진 소유 확인 (2026-09-02). ⚠️ **SEO:START 마커 바깥**이어야 한다 —
         그 구간은 scripts/prerender.mjs 가 페이지마다 통째로 갈아 끼우므로, 안에 넣으면
         프리렌더된 32장에서 이 태그가 사라진다. 확인은 대문만 보지만 전 페이지에 남는 편이
         안전하다(재확인 시점에 어느 주소를 볼지 우리가 정하지 않는다). -->
    <meta name="naver-site-verification" content="a9d42acd1a54c40c4ab9bfec846bc65fd8856205" />
    <title>SPIN — 파워체어 풋볼 드릴 플래너</title>
    <!-- SEO:START — 이 구간은 scripts/prerender.mjs 가 페이지마다 **통째로 갈아 끼운다.**
         마커를 지우면 프리렌더가 실패한다(조용히 넘어가면 페이지마다 canonical 이 두 벌씩
         들어가고, 서로 다른 주소를 가리키는 canonical 두 개는 구글이 둘 다 버린다).

         여기 적힌 값은 **뿌리 한 장의 기본값**이자 `npm run dev` 에서 보이는 값이다. 규칙
         해설 33장의 값은 src/seo/prerenderData.ts 의 SITE 표에서 나온다 — 문구를 고칠 때
         양쪽을 같이 봐야 한다. 여기만 고치면 대문만 바뀌고 나머지 32장은 옛말을 한다. -->
    <meta

      content="파워체어 풋볼(전동휠체어 축구) 전용 전술판. 드릴을 만들어 팀 앞에서 시연하고, 경기 규칙을 그림과 시연 장면으로 배웁니다. 설치도 가입도 없이 브라우저에서 바로 열립니다."
    />
    <link rel="canonical" href="https://spin.atit.app/" />
    <link rel="alternate" hreflang="ko" href="https://spin.atit.app/" />
    <link rel="alternate" hreflang="en" href="https://spin.atit.app/en/" />
    <link rel="alternate" hreflang="ja" href="https://spin.atit.app/ja/" />
    <link rel="alternate" hreflang="x-default" href="https://spin.atit.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SPIN" />
    <meta property="og:title" content="SPIN — 파워체어 풋볼 드릴 플래너" />
    <meta
      property="og:description"
      content="파워체어 풋볼 전용 전술판. 드릴을 만들어 팀 앞에서 시연하고, 경기 규칙을 그림과 시연 장면으로 배웁니다."
    />
    <meta property="og:url" content="https://spin.atit.app/" />
    <!-- 정사각 아이콘이라 큰 카드(summary_large_image)가 아니라 summary 다. 1200×630 짜리
         전용 이미지를 만들면 그때 큰 카드로 올린다 — 없는 이미지를 있다고 적으면 공유 카드가
         빈 칸으로 뜬다. -->
    <meta property="og:image" content="https://spin.atit.app/icon-512.png" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SPIN",
        "alternateName": "SPIN — 파워체어 풋볼 드릴 플래너",
        "url": "https://spin.atit.app/",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Web",
        "inLanguage": "ko",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
      }
    </script>
    <!-- SEO:END -->
    <!-- 프리렌더 본문의 최소 서식. **인라인이어야 한다** — 이 글은 앱 CSS 가 붙기 전에도,
         JS 가 아예 실패해도 읽혀야 하는 마지막 방어선이다. React 가 마운트되는 순간
         `#root` 의 자식이 통째로 교체되면서 이 블록도 같이 사라진다(scripts/prerender.mjs). -->
    <style>
      .seo-prerender {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
        color: #e6edf3;
        font: 16px/1.7 system-ui, -apple-system, 'Noto Sans KR', sans-serif;
      }
      .seo-prerender h1 { font-size: 1.6rem; line-height: 1.3; margin: 0 0 0.5rem; }
      .seo-prerender h2 { font-size: 1.15rem; margin: 2rem 0 0.5rem; }
      .seo-prerender h3 { font-size: 1rem; margin: 1.5rem 0 0.25rem; }
      .seo-prerender p { margin: 0 0 0.75rem; }
      .seo-prerender ul { margin: 0 0 1rem; padding-left: 1.25rem; }
      /* 2026-09-06: 방침·약관 프리렌더(data-seo-page="legal")가 쓰는 것들. 원문 HTML 이 조문을
         <ol> 로, 시행일·문의를 .meta 로 적는다(PLAN-LEGAL-PAGES 결정 6 — 원문 안쪽 요소는
         인라인 스타일을 못 받는다). 번호는 글머리표보다 자리를 더 먹어 padding 이 크다.
         .meta 는 색 대신 크기·불투명도로 낮춘다 — 이 블록의 hex 는 늘리지 않는다. */
      .seo-prerender ol { margin: 0 0 1rem; padding-left: 1.5rem; }
      .seo-prerender li { margin: 0 0 0.35rem; }
      .seo-prerender .meta { font-size: 0.9rem; opacity: 0.75; margin: 0 0 1.5rem; }
      .seo-prerender a { color: #6cf; }
      :root[data-theme='light'] .seo-prerender { color: #1a2029; }
      /* 2026-09-06: JS 가 도는 브라우저에서는 **홈** 프리렌더 글을 첫 페인트부터 감춘다(아래 부트
         스크립트가 data-js 를 심는다). 안 그러면 "글 → 로더 → 앱" 순으로 글이 잠깐 비친다.
         크롤러가 받는 HTML 은 그대로고(JS 를 안 돌리는 봇은 이 속성이 안 붙는다), React 가
         마운트되면 이 블록은 통째로 사라지므로 렌더 후 DOM 도 전과 같다 — SEO 손실 없음.
         규칙 글은 감추지 않는다: 거기선 로더가 안 뜨고(prerenderLanding.ts) 이 글이 곧 내용이라
         감추면 빈 화면 → 글이 된다. */
      :root[data-js] .seo-prerender[data-seo-page='home'] { visibility: hidden; }

      /* 부트 마크 (2026-09-15) — 첫 픽셀까지의 백지를 없앤다.
         ⚠️ 이 블록은 **레이아웃만** 진다. 움직임은 하나도 없다 — 아래 마크는 정지 자세이고,
         움직이는 로더는 React 의 `AppLoaderOverlay` 가 마운트되면서 이어받는다.
         `--bg` 는 같은 순간에 오는 번들 스타일시트(tokens.css)가 준다. 그게 오기 전 몇 ms 를
         위해 var() 안에 기본값을 둔다 — 두 값을 따로 선언하면 안 된다(var 가 무효일 때
         앞 선언으로 안 돌아가고 transparent 가 된다). */
      #spin-boot {
        position: fixed;
        inset: 0;
        /* AppLoaderOverlay 의 LOADER_Z 와 같은 값 */
        z-index: 220;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg, #0b0f14);
      }
      :root[data-theme='light'] #spin-boot { background: var(--bg, #ffffff); }
      /* 크기는 appLoaderTiming.ts 의 MARK_SIZE.boot(min 96 · 20vmin · max 144)와 같은 식이다.
         값이 갈리면 React 로더가 이어받는 순간 마크가 한 번 커지거나 작아진다. */
      #spin-boot img { display: block; width: clamp(96px, 20vmin, 144px); height: auto; }
    </style>
    <!-- §4.6 FOUC 방지 부트 스크립트 — 스타일시트보다 먼저 실행돼야 한다. localStorage 를
         React 마운트 전에 동기로 읽어 data-theme 을 심는다(IDB 는 비동기라 여기 못 쓴다).
         이 필드의 위치·타입을 바꾸는 마이그레이션은 이 스크립트도 같은 커밋에서 고쳐야 한다
         (storage/prefs.ts 쪽 주석과 상호 참조). -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('spin.prefs') || '{}');
        document.documentElement.dataset.theme = p.theme === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
      // 홈 프리렌더 글 감춤(위 <style>). 번들이 끝내 안 오면 4초 뒤 다시 드러낸다 — 그때는
      // 이 글이 JS 실패의 마지막 방어선이다. React 가 이미 떴으면 그 블록은 없으므로 무해하다.
      document.documentElement.dataset.js = '1';
      setTimeout(function () { delete document.documentElement.dataset.js; }, 4000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 부트 마크 (2026-09-15, 기현님 실기: *"데탑앱에서 첫 로딩 애니가 툭툭 끊긴다"*).
         데스크톱과 같은 엔진(WebKitGTK 4.1)에 빌드본을 올려 재 보니 **첫 픽셀이 865ms** 였다.
         내역: 번들 컴파일·평가 175ms · 프로바이더 70ms · **AppShell 첫 렌더 530ms**(부팅 화면이
         board = EditorWorkspace 라 가장 무거운 마운트가 첫 화면이다). 그동안 화면은 백지다 —
         데스크톱은 프리렌더도 안 굽기 때문에 정말 아무것도 없다.
         이 한 장이 그 구간을 메운다. 실측으로 첫 픽셀이 230ms 로 내려온다.

         ⚠️ **움직이지 않는다. 그것이 이 요소의 계약이다.**
         ① 그 530ms 는 메인 스레드가 통째로 막힌 구간이라 여기서 무엇을 돌려도 어차피 선다.
         ② React 로더가 뜨는 순간 이 요소는 사라지는데, 그때 새로 생긴 요소의 CSS 애니메이션은
            **0% 부터 다시 시작한다.** 이쪽이 사이클 중간(실측 53%)이었다면 마크가 발길질하다가
            제자리로 튄다. 정지 자세로 두면 그 이음매가 **없다** — 사이클 0% 가 곧 정지 자세이기
            때문이다(SpinLoaderMark.tsx 머리말·styles/a11y.css §5).
         그래서 마크를 인라인으로 옮겨 적지 않고 **정본 `logo.svg` 를 그대로 쓴다**(3KB).
         좌표가 세 벌이 되는 것을 막는 유일한 방법이기도 하다.

         ⚠️ `#root` **밖**이어야 한다 — scripts/prerender.mjs 가 `<div id="root"></div>` 라는
         **문자열 그대로**를 찾아 본문으로 갈아 끼운다. 안에 넣으면 그 치환이 조용히 빗나가
         프리렌더 33장이 본문 없이 나간다(그 실패는 에러를 안 낸다). -->
    <div id="spin-boot" aria-hidden="true"><img src="/logo.svg" alt="" /></div>
    <script>
      (function () {
        var el = document.getElementById('spin-boot');
        if (!el) return;
        // 프리렌더로 **읽을 글**이 이미 깔린 페이지는 덮지 않는다 — 판정도 사유도
        // `app/loader/prerenderLanding.ts` 와 같다(결정 13). 두 곳이 갈리면 검색으로 규칙
        // 해설에 들어온 사람이 본문 대신 마크를 본다.
        if (document.querySelector('.seo-prerender[data-seo-page="rules"], .seo-prerender[data-seo-page="legal"]')) {
          el.remove();
          return;
        }
        // 감축 모션이면 로더 자체가 안 뜬다(결정 8) — 부트 마크도 같이 없다.
        try {
          var p = JSON.parse(localStorage.getItem('spin.prefs') || '{}');
          var always = p.a11y && p.a11y.reduceMotion === 'always';
          var os = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (always || os) el.remove();
        } catch (e) {}
        // 번들이 끝내 안 오면 걷는다 — 위 프리렌더 글 되살리기와 같은 4초, 같은 사유다.
        // 평소에는 AppShell 이 첫 커밋에서 먼저 지우므로 이 타이머는 도달하지 않는다.
        setTimeout(function () { el.remove(); }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
