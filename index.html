<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <title>SPIN — 파워체어 풋볼 드릴 플래너</title>
    <!-- §4.6 FOUC 방지 부트 스크립트 — 스타일시트보다 먼저 실행돼야 한다. localStorage 를
         React 마운트 전에 동기로 읽어 data-theme 을 심는다(IDB 는 비동기라 여기 못 쓴다).
         이 필드의 위치·타입을 바꾸는 마이그레이션은 이 스크립트도 같은 커밋에서 고쳐야 한다
         (storage/prefs.ts 쪽 주석과 상호 참조). -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('spin.prefs') || '{}');
        document.documentElement.dataset.theme = p.theme === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
