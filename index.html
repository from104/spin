<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 2026-08-14 기현님이 새 아이콘(코트 위 파워체어 + 공 + 회전 화살표 = SPIN)을 주셨다.
         원본은 2048² PNG 이라 벡터로 바꿀 수 없어 favicon.svg 를 은퇴시키고 래스터로 간다.
         마스터는 `art/spin-icon-2048.png` 다 — **public/ 에 두면 4 MB 가 그대로 배포된다.**
         32/48 두 벌을 주는 이유: 브라우저가 탭·북마크·바로가기에서 서로 다른 크기를 집는다. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <!-- §6.4 태블릿 앱 경험 — "홈 화면에 추가" 하면 브라우저 크롬 없이 전체화면으로 뜬다.
         나중에 네이티브 태블릿 앱으로 포팅하기 전까지 그 자리를 대신하고, 포팅 후에도
         start_url·아이콘·테마색은 그대로 재사용된다.
         iOS 는 아직 manifest 의 display 를 보지 않으므로 apple- 메타가 별도로 필요하다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SPIN" />
    <!-- black-translucent: 상태바 뒤까지 앱이 그린다. 그 겹침은 appShell.css 의
         env(safe-area-inset-*) 여백이 받아낸다(둘은 한 쌍이라 하나만 두면 UI 가 먹힌다). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>SPIN — 파워체어 풋볼 드릴 플래너</title>
    <!-- §4.6 FOUC 방지 부트 스크립트 — 스타일시트보다 먼저 실행돼야 한다. localStorage 를
         React 마운트 전에 동기로 읽어 data-theme 을 심는다(IDB 는 비동기라 여기 못 쓴다).
         이 필드의 위치·타입을 바꾸는 마이그레이션은 이 스크립트도 같은 커밋에서 고쳐야 한다
         (storage/prefs.ts 쪽 주석과 상호 참조). -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('spin.prefs') || '{}');
        document.documentElement.dataset.theme = p.theme === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
