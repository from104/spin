name: spin
base: core24
adopt-info: build-app
title: SPIN
summary: Tactic board and drill planner for powerchair football
description: |
  A tactic board built for powerchair football. Draw drills, present them to
  your team, and learn the Laws of the Game through diagrams and animated scenes.

  Drills are stored on your own device. There is no account and no server
  collecting them — an optional sign-in syncs to your own Google Drive.

  Korean, English and Japanese.

grade: stable
confinement: strict
license: MIT
website: https://spin.atit.app
source-code: https://github.com/from104/spin
issues: https://github.com/from104/spin/issues
contact: https://github.com/from104/spin/issues

# ⚠️ Tauri 2 는 webkit2gtk **4.1** 을 찾는데, 스냅 안에서는 그 경로가 $SNAP 아래로 들어간다.
# 이 layout 이 없으면 앱이 뜨다가 webkit 프로세스를 못 찾고 죽는다(Tauri 공식 snapcraft 문서).
#
# ⚠️ 변수 이름이 core24 에서 바뀌었다 — `$SNAPCRAFT_ARCH_TRIPLET` 은 폐기되고
# `$CRAFT_ARCH_TRIPLET_BUILD_FOR` 다. 옛 이름을 그대로 두면 빈 문자열로 풀려 경로가 어긋난다.
layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1

apps:
  spin:
    command: usr/bin/spin
    desktop: usr/share/applications/SPIN.desktop
    # gnome 익스텐션이 desktop·desktop-legacy·gsettings·opengl·wayland·x11 을 이미 준다.
    extensions: [gnome]
    plugs:
      # 드라이브 동기화·공유 링크. 없으면 그 둘이 조용히 실패한다.
      - network
      # 파일 저장/열기(내보내기·백업·드릴 파일). strict 에서 이것이 없으면 네이티브 저장
      # 대화상자가 떠도 홈 밖은커녕 홈 안에도 못 쓴다.
      - home
      # USB 로 드릴 파일을 주고받는 코치가 있다(체육관에서 노트북끼리).
      - removable-media

parts:
  build-app:
    plugin: dump
    source: .
    build-snaps:
      - node/22/stable
    # ⚠️ Tauri 공식 문서는 여기에 snapcraft-daily PPA(`package-repositories`)를 더하라고
    # 한다. **일부러 뺐다.** 그 PPA 가 주는 것은 noble 스위트인데 base 가 이제 core24(noble)라
    # 기본 저장소가 이미 그것이다. 없어도 되는 외부 저장소는 안 붙인다.
    build-packages:
      - libwebkit2gtk-4.1-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - libxdo-dev
      - libssl-dev
      - build-essential
      - patchelf
      - curl
      - dpkg
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
    override-build: |
      set -eu
      # ⚠️ 버전은 `package.json` 하나가 정본이다(tauri.conf.json 도 "../package.json" 으로
      # 읽는다). snapcraft.yaml 에 `version:` 을 손으로 적으면 릴리스마다 고칠 자리가 하나
      # 더 생기고, 잊으면 스토어만 옛 버전을 말한다. 그래서 `adopt-info` 로 여기서 읽는다.
      craftctl set version="$(node -p "require('./package.json').version")"
      # ⚠️ **rustup 을 스냅으로 깔지 않는다.** Tauri 공식 snapcraft 예제는
      # `build-snaps: [rustup/latest/stable]` 를 쓰는데, core24 빌드 환경에서 그 스냅이
      # gnome SDK 의 libc 와 충돌해 첫 호출부터 죽는다(2026-09-16 실측):
      #   rustup: symbol lookup error: /snap/gnome-46-2404-sdk/.../libc.so.6: undefined symbol
      # core22 에서는 안 터지던 자리다. 공식 설치 스크립트로 $HOME 에 깔면 그 libc 를 안 탄다.
      # (스냅은 기본 툴체인도 안 깔아 둬서 core22 에서도 `rustup default stable` 이 따로 필요했다 —
      #  아래 `--default-toolchain` 이 그 몫까지 겸한다.)
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
      export PATH="$HOME/.cargo/bin:$PATH"
      npm ci
      # ⚠️ **먼저 치운다.** `source: .` 는 프로젝트 폴더를 통째로 들고 오므로 호스트에서 예전에
      # 돌린 빌드가 남긴 deb 이 함께 딸려온다. 그대로 두고 `*.deb` 로 집으면 dpkg 가
      # *"--extract takes at most two arguments"* 로 죽는다(2026-09-16 실측: 0.6.3·0.6.7·새 판
      # 셋이 잡혔다). 치우면 글롭이 하나로 줄지만, 그것에 기대지 않고 아래에서 **이름을 지어** 집는다.
      rm -rf src-tauri/target/release/bundle/deb
      npm run tauri build -- --bundles deb
      deb="src-tauri/target/release/bundle/deb/SPIN_$(craftctl get version)_amd64.deb"
      test -f "$deb" || { echo "구운 deb 을 못 찾았다: $deb"; ls -la src-tauri/target/release/bundle/deb/ || true; exit 1; }
      dpkg -x "$deb" "$CRAFT_PART_INSTALL/"
      # 데스크톱 파일의 `Icon=spin` 은 스냅 안에서 못 찾는 상대 이름이다 — 절대 경로로 바꾼다.
      sed -i -e "s|^Icon=spin$|Icon=/usr/share/icons/hicolor/256x256@2/apps/spin.png|" \
        "$CRAFT_PART_INSTALL/usr/share/applications/SPIN.desktop"
