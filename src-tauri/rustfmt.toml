# 이 저장소 러스트의 **실제 스타일**을 글로 적는다 (2026-09-16).
#
# ⚠️ 이 파일을 둔 이유는 «fmt 를 깨끗하게 만들려고» 가 아니다. `tauri add <플러그인>` 이 끝에
# `cargo fmt` 를 **자동으로** 돌리는데, 이 파일이 없으면 기본값(4칸)이 이겨 러스트 6개 파일
# 280줄이 통째로 재포맷된다 — updater 를 붙이다 실제로 그렇게 됐고 되돌렸다. 여기 적힌 두
# 값이 그 재앙을 막는다.
#
# 값의 근거는 추측이 아니라 실측이다(2026-09-16, 기존 코드 기준):
#   · 들여쓰기 2칸 — 모든 파일이 그렇다.
#   · 최장 줄 117칸, 100칸 초과 5줄, 120칸 초과 0줄. 기본값 100 이면 그 5줄이 매번 쪼개진다.
#
# ⚠️ **그래도 `cargo fmt --check` 는 0 이 아니다**(실측 9곳). 이 크레이트는 손으로 맞춘
# 코드이고 rustfmt 와 취향이 갈리는 자리가 남는다 — `use_small_heuristics = "Max"` 로 그중
# 다섯은 지워지지만 대신 **일부러 여러 줄로 편 코드를 한 줄로 접으려** 들어 더 나빴다.
# 그래서 안 넣는다. **크레이트 전체에 `cargo fmt` 를 돌리지 마라** — 고친 파일만 보면 된다.
