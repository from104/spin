# 이 저장소 러스트의 스타일 (2026-09-16).
#
# ⚠️ `tauri add <플러그인>` 은 끝에 `cargo fmt` 를 **자동으로** 돌린다. 그때 이 파일이 이긴다.
# 그러니 여기 적힌 값과 실제 코드가 어긋나 있으면, 플러그인 하나 붙일 때마다 크레이트가 통째로
# 재포맷된다(updater 를 붙이다 러스트 6개 파일 280줄이 실제로 그렇게 됐다). 어긋나지 않게
# 두는 것이 이 파일의 일이다.
#
# `max_width` 만 기본값에서 옮긴다. 근거는 실측이다(2026-09-16 기존 코드): 최장 줄 117칸,
# 100칸 초과 5줄, 120칸 초과 0줄. 기본값 100 이면 그 다섯 줄이 매번 쪼개진다.
max_width = 120

# ── ⚠️ 2026-09-16: 아래 문단은 기현님 지시로 뒤집혔다 ──────────────────────────────────
#
# 원문(그대로 남긴다):
#   > 값의 근거는 추측이 아니라 실측이다(2026-09-16, 기존 코드 기준):
#   >   · 들여쓰기 2칸 — 모든 파일이 그렇다.
#   > ⚠️ **그래도 `cargo fmt --check` 는 0 이 아니다**(실측 9곳). 이 크레이트는 손으로 맞춘
#   > 코드이고 rustfmt 와 취향이 갈리는 자리가 남는다. **크레이트 전체에 `cargo fmt` 를
#   > 돌리지 마라** — 고친 파일만 보면 된다.
#
# 뒤집은 이유: 기현님 판정 *"rs파일은 들여뜨기 4간 맞아"*. 4칸이 러스트의 표준이고 rustfmt
# 기본값이다. 옛 근거의 전제가 틀렸던 것이 아니라 — 이 크레이트가 정말로 2칸이었다 — **전제를
# 잘못 고른 것이다.** 「지금 코드가 이러니 그대로 굳히자」로 읽었지, 「이 코드가 언어의 표준에서
# 벗어나 있다」로 읽지 않았다. 2칸은 이 저장소의 TypeScript 관례가 러스트로 흘러든 자국이다.
#
# 뒤집고 나서 얻은 것: `cargo fmt` 를 크레이트 전체에 돌려 **`cargo fmt --check` 가 0 이 됐다.**
# 그래서 위의 «돌리지 마라» 도 함께 죽었다 — 이제 언제든 돌려도 되고, `tauri add` 가 제멋대로
# 돌려도 diff 가 안 난다. 취향이 갈려 남아 있던 9곳도 같이 사라졌다.
