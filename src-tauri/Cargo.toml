[package]
name = "spin"
# 번들에 찍히는 버전은 tauri.conf.json 의 "version": "../package.json" 이 package.json 에서
# 직접 읽어 간다. 아래 값은 크레이트 자체 버전일 뿐이라 릴리스마다 맞출 필요가 없다.
version = "0.5.0"
description = "파워체어풋볼 전술판"
authors = ["Seo Kihyun <from104@gmail.com>"]
repository = "https://github.com/from104/spin"
publish = false
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "spin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `devtools` — 릴리스 빌드에서도 웹 인스펙터를 연다(창에서 우클릭 → 요소 검사).
# 데스크톱은 웹 콘솔이 stdout 에 안 찍혀서, 이게 없으면 화면 안에서 벌어지는 일(CSP 차단·
# 팝업 침묵·구글 쪽 오류)을 볼 방법이 아예 없다 — 2026-08-27 드라이브 연결이 아무 반응 없이
# 멈췄을 때 실제로 그래서 막혔다. 배포본에 남겨도 사용자에게 해가 없고, 체육관에서 나는
# 문제를 원격으로 물어볼 수 있는 유일한 창구다.
tauri = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-log = "2"
