[package]
name = "spin"
# 번들에 찍히는 버전은 tauri.conf.json 의 "version": "../package.json" 이 package.json 에서
# 직접 읽어 간다. 아래 값은 크레이트 자체 버전일 뿐이라 릴리스마다 맞출 필요가 없다.
version = "0.5.0"
description = "파워체어풋볼 전술판"
authors = ["Seo Kihyun <from104@gmail.com>"]
repository = "https://github.com/from104/spin"
publish = false
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "spin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
