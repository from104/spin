<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SPIN">
  <!-- SPIN 앱 마크 (2026-08-14 기현님 아이콘의 벡터판).
       자동 추적이 아니라 **다시 그린 것**이다 — 원본이 원·둥근 사각·점 몇 개의 기하 도형이라
       추적하면 곡선이 수백 점으로 쪼개져 오히려 커지고 흐려진다. 여기서는 도형 6개다.
       래스터(art/spin-icon-2048.png)는 은퇴했다 — 파비콘·레일 로고·PWA 아이콘 전부 이 파일에서 굽는다.

       🪧 **그림이 무엇인지** (2026-08-31 기현님 정정): 원 두 겹이 **코트 바닥**이고, 그 위에
       45° 눕힌 둥근 사각이 **휠체어**다. 스핀킥을 차기 직전의 자세 — 차체가 돌아서 있고 공이
       그 앞에 놓여 있다. 흰 원은 선수 머리다. 그 전 주석은 사각을 '코트', 흰 파선을 '골라인'
       이라 불렀는데 둘 다 틀렸다(정작 같은 주석 뒷부분은 *"이 마크의 휠체어는…"* 이라며 제대로
       알고 있었다). ⚠️ 색을 만질 때 **무엇이 무엇인지 아는 것이 중요하다** — 2026-08-31 에
       코트를 나무색으로 옮겼다가 되돌린 왕복이 이 라벨 때문에 한 번 엉뚱한 도형을 겨눴다. -->
  <circle cx="256" cy="256" r="248" fill="#2f5d2b" />
  <circle cx="256" cy="256" r="234" fill="#a4e70c" />

  <!-- 휠체어 — 긴 변이 오른쪽 위를 향하도록 45° 눕힌다. 회전은 그룹 하나가 다 진다:
       안쪽 좌표는 회전을 모르는 채 (길이 224 × 폭 130) 로 읽힌다. -->
  <g transform="translate(228 234) rotate(-45)">
    <rect x="-112" y="-65" width="224" height="130" rx="21" fill="#2e6db6" />
    <!-- 차체 뒤끝의 흰 파선. 선 자체가 변 위에 놓이므로 반 두께만큼 안으로 들인다
         (안 그러면 둥근 모서리 밖으로 삐져나온다). -->
    <path d="M-104 -59 V59" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="butt"
      stroke-dasharray="21 15" />
    <!-- 머리 — **회전 그룹 안**이라야 한다(기현님 지적: *"흰 원이 머리인데 한 귀퉁이로 몰리면
         안 된다"*). 밖에 두면 차체 축과 무관한 절대 좌표라 차체가 돌 때마다 엉뚱한 데 찍힌다.
         자리는 앱이 코트에 그리는 그 자리다(core/constants.ts 의 CHAIR): 피벗은 뒤에서 길이의
         20%(7.5/37.5) 지점이고 **폭 한가운데**(y=0)다. 반지름도 같은 비율 — 4.2/25 = 폭의 16.8%.
         그래서 이 마크의 휠체어는 트레이 칩·코트 칩과 같은 물건으로 읽힌다. -->
    <circle cx="67" cy="0" r="22" fill="#fff" />
  </g>

  <!-- 공 — 색은 앱의 BALL_FILL(#fbbf24) 그대로다. 테두리가 배경 초록이라 밝은 초록 위에서
       형태가 또렷하다(공 자체에 테두리를 주는 것은 코트 위 개체와 같은 규율이다). -->
  <circle cx="305" cy="345" r="34" fill="#fbbf24" stroke="#2f5d2b" stroke-width="8" />
</svg>
